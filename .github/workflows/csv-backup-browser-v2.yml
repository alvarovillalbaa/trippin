# INACTIVE. Root pins the published preparation and READY deployment before QA activation.
name: Temporary Trippin CSV and backup browser v2
on:
  push:
    branches: [qa/trippin-portability-20261105]
permissions:
  contents: read
concurrency:
  group: trippin-portability-20261105
  cancel-in-progress: false
jobs:
  browser:
    if: github.event_name == 'push' && github.repository == 'alvarovillalbaa/trippin' && github.event.repository.private == false && github.ref == 'refs/heads/qa/trippin-portability-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      SOURCE_COMMIT: ce2d5ce323637ea8ec1a9b0bc47050d74a130551
      TRIPPIN_EXPECTED_DEPLOYMENT: dpl_G7sgQFFuK3SKay39ZDYQgjPh6voC
      TRIPPIN_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Run only the pinned hosted portability packet
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRIPPIN_EXPECTED_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          node scripts/run-csv-backup-browser.mjs --source-commit "$SOURCE_COMMIT"
