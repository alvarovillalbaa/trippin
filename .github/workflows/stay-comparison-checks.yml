# Inactive source. Root owns the separate main-only active workflow and retirement.
name: Trippin stay comparison
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed checker preparation SHA
        type: string
        required: true
      runtime_sha:
        description: Exact separately reviewed deployed application SHA
        type: string
        required: true
      deployment_id:
        description: Actual READY deployment ID independently bound to runtime_sha
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: trippin-stay-comparison-checks
  cancel-in-progress: false
jobs:
  stay-comparison:
    if: github.repository == 'alvarovillalbaa/trippin' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      SOURCE_COMMIT: ${{ inputs.source_sha }}
      TRIPPIN_STAY_RUNTIME_COMMIT: ${{ inputs.runtime_sha }}
      TRIPPIN_STAY_EXPECTED_DEPLOYMENT: ${{ inputs.deployment_id }}
      TRIPPIN_STAY_PUBLIC_REPOSITORY: 'true'
    steps:
      - name: Bind immutable inputs and earliest job clock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRIPPIN_STAY_RUNTIME_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRIPPIN_STAY_EXPECTED_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]{10,100}$ ]]
          test "$SOURCE_COMMIT" != "$TRIPPIN_STAY_RUNTIME_COMMIT"
          test "$SOURCE_COMMIT" != "$GITHUB_SHA"
          test "$TRIPPIN_STAY_RUNTIME_COMMIT" != "$GITHUB_SHA"
          echo "TRIPPIN_STAY_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          check-latest: false
      - name: Two focused stay comparisons and owned cleanup
        shell: bash
        run: node tests/scripts/run-stay-comparison-checks.mjs --source-commit "$SOURCE_COMMIT"
